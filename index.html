<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173b57">
<title>Liedermappe</title>
<meta name="description" content="Gemeinsame Liedersuche in der Liedermappe.">
<meta name="theme-color" content="#173b57">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">

<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#17232d;background:#f3f6f8}
*{box-sizing:border-box}body{margin:0}
header{background:#173b57;color:white;padding:22px 18px 20px}
header h1{font-size:25px;margin:0 0 5px;font-weight:700}
header p{margin:0;color:#dce8ef;font-size:14px}
main{max-width:850px;margin:0 auto;padding:18px 14px 40px}
.searchbox{display:flex;gap:8px;position:sticky;top:0;background:#f3f6f8;padding:8px 0 14px;z-index:2}
input{min-width:0;flex:1;font:inherit;font-size:18px;padding:13px 14px;border:1px solid #aab8c2;border-radius:12px;background:white}
button{border:0;border-radius:12px;padding:0 16px;font-size:23px;background:#e2ebf1;color:#173b57;min-width:54px}
button:active{transform:scale(.98)}
#status{font-size:13px;color:#526574;margin:0 2px 12px}
.results{display:grid;gap:9px}
.song{background:white;border:1px solid #e0e7ec;border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:54px 1fr;gap:10px;align-items:center}
.ref{font-size:13px;color:#657785;font-weight:650}
.title{font-weight:650;font-size:16px;overflow-wrap:anywhere}
.name{font-size:13px;color:#60717d;margin-top:3px}
.empty{padding:24px;text-align:center;color:#61717c;background:white;border-radius:12px}
footer{font-size:12px;color:#778792;text-align:center;margin:24px 0}
@media(min-width:650px){.results{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><h1>Liedermappe</h1><p>Titelsuche – tippen oder Spracheingabe verwenden</p></header>
<main>
<div class="searchbox" style="position:static;gap:8px">
<div style="display:flex;gap:6px;align-items:center;flex:1;min-width:0">
<input id="guestCode" type="password" placeholder="Gäste-Zugangscode" autocomplete="current-password" aria-label="Gäste-Zugangscode" style="flex:1;min-width:0">
<button id="toggleCode" type="button" aria-label="Zugangscode anzeigen" title="Zugangscode anzeigen" style="font-size:15px;min-width:44px;padding:8px">👁</button>
</div>
<button id="login" type="button" style="font-size:15px;min-width:auto">Anmelden</button>
</div>
<div class="searchbox">
<input id="q" type="search" placeholder="Songtitel suchen …" autocomplete="off" aria-label="Songtitel suchen">
<button id="speechLangToggle" type="button" aria-label="Sprache wechseln" title="Spracheingabe: Englisch (zum Wechseln antippen)" style="font-size:12px;min-width:36px;padding:7px 5px;border:1px solid #cbd5e1;border-radius:9px;background:white">EN</button>
<button id="mic" aria-label="Spracheingabe starten" title="Spracheingabe">🎤</button>
</div>
<p id="status" aria-live="polite"></p>
<section id="results" class="results"></section>
<footer>Private Liedermappen-App · gemeinsame Titelliste</footer>
</main>
<script>
let songs=[];
const norm=s=>(s||"").toLocaleLowerCase("de-DE").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/&/g," and ").replace(/[^a-z0-9äöüß ]/gi," ").replace(/\s+/g," ").trim();
function phon(s){return norm(s).replace(/dsch/g,"j").replace(/tsch/g,"ch").replace(/sch/g,"sh").replace(/w/g,"v").replace(/z/g,"s").replace(/ks/g,"x").replace(/ph/g,"f").replace(/ck/g,"k").replace(/qu/g,"kw");}
function edit(a,b){let prev=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let cur=[i];for(let j=1;j<=b.length;j++)cur[j]=Math.min(cur[j-1]+1,prev[j]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur;}return prev[b.length];}
function closeWord(q,words){
  if(q.length<5)return false;
  return words.some(w=>{
    if(w.length<5)return false;
    if(w.includes(q))return true;
    const limit=Math.max(q.length,w.length)>=9?2:1;
    if(edit(q,w)<=limit)return true;
    const pq=phon(q),pw=phon(w);
    return pq.length>=5 && pw.length>=5 && edit(pq,pw)<=limit;
  });
}
function matches(query,s){
  const q=norm(query);
  if(!q)return true;
  const title=norm(s.titel);
  if(title.includes(q))return true;
  const parts=q.split(' ').filter(Boolean);
  const words=title.split(' ').filter(Boolean);
  // Bei mehreren Suchwörtern müssen alle im Songtitel vorkommen bzw. passen.
  if(parts.length>1)return parts.every(part=>words.some(w=>w===part || (part.length>=5 && closeWord(part,[w]))));
  // Einzelne kurze Begriffe werden nur exakt als Teil des Titels gesucht.
  const part=parts[0]||'';
  if(part.length<5)return title.includes(part);
  return words.some(w=>w===part || closeWord(part,[w]));
}
const PROJECT_URL="https://dhpoyjemsltdbhvmsggg.supabase.co";
const PUBLISHABLE_KEY="sb_publishable_fel6O7eEu9vH6OeQzJcvRA_dCcaOrB5";
const API_URL=PROJECT_URL+"/functions/v1/liedermappe-api";
const input=document.getElementById("q"), results=document.getElementById("results"),status=document.getElementById("status");
const codeInput=document.getElementById("guestCode"), loginButton=document.getElementById("login");
let speechLanguage="en-US";
const speechLangToggle=document.getElementById("speechLangToggle");
speechLangToggle.addEventListener("click",()=>{
  speechLanguage=speechLanguage==="en-US"?"de-DE":"en-US";
  speechLangToggle.textContent=speechLanguage==="en-US"?"EN":"DE";
  speechLangToggle.title="Spracheingabe: "+(speechLanguage==="en-US"?"Englisch":"Deutsch")+" (zum Wechseln antippen)";
  speechLangToggle.setAttribute("aria-label",speechLangToggle.title);
});
const toggleCodeButton=document.getElementById("toggleCode");
toggleCodeButton.addEventListener("click",()=>{
  const show=codeInput.type==="password";
  codeInput.type=show?"text":"password";
  toggleCodeButton.textContent=show?"🙈":"👁";
  toggleCodeButton.setAttribute("aria-label",show?"Zugangscode verbergen":"Zugangscode anzeigen");
  toggleCodeButton.title=show?"Zugangscode verbergen":"Zugangscode anzeigen";
});
input.disabled=true;
let guestCode="", searchTimer=null, requestNumber=0, loggedIn=false;

function render(found,totalLabel){
  results.replaceChildren();
  status.textContent=totalLabel;
  if(!found.length){let e=document.createElement("div");e.className="empty";e.textContent="Kein passender Titel gefunden. Versuche einen anderen Suchbegriff.";results.append(e);return;}
  found.forEach(s=>{
    let card=document.createElement("article");card.className="song";
    let ref=document.createElement("div");ref.className="ref";
    ref.textContent=`${s.chapter ?? s.kap ?? ""} / ${s.song_number ?? s.nr ?? ""}`;
    let info=document.createElement("div"),title=document.createElement("div"),name=document.createElement("div");
    title.className="title";title.textContent=s.title ?? s.titel ?? "";
    name.className="name";name.textContent=s.folder ?? s.name ?? "";
    info.append(title,name);card.append(ref,info);results.append(card);
  });
}

async function searchSongs(){
  if(!loggedIn)return;
  const q=input.value.trim(), myRequest=++requestNumber;
  status.textContent="Suche in der gemeinsamen Titelliste …";
  try{
    const response=await fetch(API_URL,{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "apikey":PUBLISHABLE_KEY,
        "Authorization":"Bearer "+PUBLISHABLE_KEY
      },
      body:JSON.stringify({action:"guest_search",code:guestCode,query:q})
    });
    const data=await response.json();
    if(myRequest!==requestNumber)return;
    if(!response.ok){
      const message=data.error||data.message||"HTTP "+response.status;
      status.textContent="Suche fehlgeschlagen: "+message;
      results.replaceChildren();
      return;
    }
    const list=Array.isArray(data.songs)?data.songs:[];
    render(list,`${list.length} Treffer${q?" für „"+q+"“":""}`);
  }catch(err){
    if(myRequest!==requestNumber)return;
    status.textContent="Verbindung fehlgeschlagen. Bitte Internetverbindung prüfen und erneut versuchen.";
    results.replaceChildren();
  }
}

function scheduleSearch(){
  clearTimeout(searchTimer);
  searchTimer=setTimeout(searchSongs,250);
}
loginButton.addEventListener("click",async()=>{
  const entered=codeInput.value.trim();
  if(!entered){status.textContent="Bitte zuerst den Gäste-Zugangscode eingeben.";codeInput.focus();return;}
  guestCode=entered;loggedIn=true;input.disabled=false;
  loginButton.disabled=true;loginButton.textContent="Prüfe …";
  await searchSongs();
  loginButton.disabled=false;loginButton.textContent="Anmelden";
  if(status.textContent.startsWith("Suche fehlgeschlagen")){loggedIn=false;input.disabled=true;}
});
input.addEventListener("input",scheduleSearch);
codeInput.addEventListener("keydown",e=>{if(e.key==="Enter")loginButton.click();});
document.getElementById("mic").addEventListener("click",()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){status.textContent="Spracheingabe wird in diesem Browser nicht unterstützt. Bitte Suchtext eingeben.";return;}const r=new SR();r.lang=speechLanguage;r.interimResults=false;r.onstart=()=>status.textContent="Ich höre zu …";r.onresult=e=>{input.value=e.results[0][0].transcript;input.dispatchEvent(new Event("input",{bubbles:true}));};r.onerror=e=>{status.textContent="Spracheingabe nicht möglich ("+e.error+"). Bitte Mikrofonfreigabe prüfen oder den Titel eintippen.";};r.onend=()=>{if(status.textContent==="Ich höre zu …")status.textContent="Keine Sprache erkannt. Bitte erneut versuchen.";};try{r.start();}catch(e){status.textContent="Spracheingabe konnte nicht gestartet werden. Bitte erneut versuchen.";}});render();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(err => {
      console.warn("App-Offlinefunktionen konnten nicht aktiviert werden:", err);
    });
  });
}
</script>
\n</body></html>
